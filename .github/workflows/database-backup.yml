name: Production database backup

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted PostgreSQL backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.BACKUP_AWS_ROLE_ARN }}
          aws-region: ${{ vars.BACKUP_AWS_REGION }}
      - name: Create, verify and encrypt-upload backup
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
          BACKUP_KMS_KEY_ID: ${{ vars.BACKUP_KMS_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          test -n "$BACKUP_BUCKET"
          test -n "$BACKUP_KMS_KEY_ID"
          timestamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          filename="motoya-postgres-${timestamp}.dump"
          pg_dump "$DATABASE_URL" --format=custom --no-owner --file="$filename"
          pg_restore --list "$filename" >/dev/null
          aws s3 cp "$filename" "s3://${BACKUP_BUCKET}/motoya/postgres/${filename}" --sse aws:kms --sse-kms-key-id "$BACKUP_KMS_KEY_ID"
          rm -f "$filename"
